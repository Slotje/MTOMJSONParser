<div class="json-viewer">
  <div class="toolbar">
    <button mat-icon-button (click)="copyToClipboard()" matTooltip="Copy to clipboard">
      <mat-icon>content_copy</mat-icon>
    </button>
  </div>

  <!-- Simple key-value display -->
  <mat-expansion-panel class="section-panel" [expanded]="true">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon>list_alt</mat-icon>
        Mapped Fields ({{ getFieldCount() }})
      </mat-panel-title>
    </mat-expansion-panel-header>
    <div class="metadata-grid">
      <div class="metadata-item" *ngFor="let item of data | keyvalue">
        <span class="key">{{ item.key }}:</span>
        <span class="value" *ngIf="!isArray(item.value)">{{ item.value }}</span>
        <ul class="value-list" *ngIf="isArray(item.value)">
          <li *ngFor="let val of asArray(item.value)">{{ val }}</li>
        </ul>
      </div>
    </div>
  </mat-expansion-panel>

  <!-- Raw JSON view -->
  <mat-expansion-panel class="section-panel">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon>code</mat-icon>
        Raw JSON
      </mat-panel-title>
    </mat-expansion-panel-header>
    <pre class="json-code">{{ formattedJson }}</pre>
  </mat-expansion-panel>
</div>
