version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_LOG_LEVEL=INFO
    volumes:
      - ./config:/opt/app/config/clients
    networks:
      - mtom-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mtom-network

networks:
  mtom-network:
    driver: bridge

volumes:
  config:
