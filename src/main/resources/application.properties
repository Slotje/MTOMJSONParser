# Application Configuration
quarkus.application.name=mtom-json-parser
quarkus.application.version=1.0.0-SNAPSHOT

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.cors=true

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.json=false

# JSON Logging for production
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.pretty-print=false

# Health Check
quarkus.health.extensions.enabled=true

# Metrics
quarkus.micrometer.export.prometheus.enabled=true

# OpenShift Configuration
quarkus.openshift.route.expose=true
quarkus.openshift.labels.app=mtom-json-parser
quarkus.openshift.labels.version=1.0.0-SNAPSHOT
quarkus.openshift.env.vars.java-opts-append=-Dquarkus.log.console.json=true

# Validation
quarkus.hibernate-validator.fail-fast=false

# MTOM Parser Configuration
mtom.parser.max-message-size=10485760
mtom.parser.default-encoding=UTF-8
mtom.parser.enable-retry=true
mtom.parser.max-retry-attempts=3

# Client Configuration Storage Path
client.config.storage.path=/opt/app/config/clients
