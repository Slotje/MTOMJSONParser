apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mtom-json-parser
      labels:
        app: mtom-json-parser
        app.kubernetes.io/name: mtom-json-parser
        app.kubernetes.io/version: "1.0.0"
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: mtom-json-parser
      template:
        metadata:
          labels:
            app: mtom-json-parser
            app.kubernetes.io/name: mtom-json-parser
            app.kubernetes.io/version: "1.0.0"
        spec:
          containers:
            - name: mtom-json-parser
              image: mtom-json-parser:1.0.0-SNAPSHOT
              imagePullPolicy: Always
              ports:
                - containerPort: 8080
                  name: http
                  protocol: TCP
              env:
                - name: JAVA_OPTS_APPEND
                  value: "-Dquarkus.log.console.json=true"
                - name: QUARKUS_LOG_LEVEL
                  value: "INFO"
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "500m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
              livenessProbe:
                httpGet:
                  path: /q/health/live
                  port: 8080
                  scheme: HTTP
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 3
                failureThreshold: 3
              readinessProbe:
                httpGet:
                  path: /q/health/ready
                  port: 8080
                  scheme: HTTP
                initialDelaySeconds: 10
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 3
              volumeMounts:
                - name: config-storage
                  mountPath: /opt/app/config/clients
          volumes:
            - name: config-storage
              persistentVolumeClaim:
                claimName: mtom-config-storage

  - apiVersion: v1
    kind: Service
    metadata:
      name: mtom-json-parser
      labels:
        app: mtom-json-parser
    spec:
      type: ClusterIP
      ports:
        - port: 8080
          targetPort: 8080
          protocol: TCP
          name: http
      selector:
        app: mtom-json-parser

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: mtom-json-parser
      labels:
        app: mtom-json-parser
    spec:
      to:
        kind: Service
        name: mtom-json-parser
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: mtom-config-storage
      labels:
        app: mtom-json-parser
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 1Gi
